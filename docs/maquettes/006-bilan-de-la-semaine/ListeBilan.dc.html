<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Liste des entrées, accès au bilan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1d5f6b}a:hover{color:#13272c}
</style>
</helmet>
<div style="width: 393px; height: 852px; box-sizing: border-box; padding: 72px 16px 40px; display: flex; flex-direction: column; gap: 16px; background: {{t.surface}}; color: {{t.ink}}; font-family: Figtree, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 34px; line-height: 38px; letter-spacing: -0.5px;">Ton journal</h1>
    <a href="#" aria-label="Réglages" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; display: grid; place-items: center; color: {{t.tide}};">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </a>
  </div>

  <a href="Main.dc.html" style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 16px; background: {{t.raised}}; color: {{t.ink}}; text-decoration: none;">
    <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; display: grid; place-items: center; background: {{t.tideSoft}}; color: {{t.tide}};">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"></path></svg>
    </span>
    <span style="flex-grow: 1; display: flex; flex-direction: column;">
      <span style="font-size: 17px; line-height: 24px; font-weight: 600;">Bilan de la semaine</span>
      <span style="font-size: 13px; line-height: 18px; color: {{t.muted}};">Du lundi 12 au dimanche 18 octobre</span>
    </span>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{t.tide}};"><path d="M9 18l6-6-6-6"></path></svg>
  </a>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <sc-for list="{{days}}" as="day" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 8px 0 0; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.2px; color: {{t.muted}};">{{day.label}}</h2>
        <sc-for list="{{day.entries}}" as="e" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: {{t.raised}};">
            <div style="display: flex; align-items: center; gap: 12px;">
              <span aria-hidden="true" style="{{e.dot}}">{{e.mood}}</span>
              <div style="display: flex; flex-direction: column;">
                <span style="font-size: 17px; line-height: 24px; font-weight: 600;">{{e.label}}</span>
                <span style="font-size: 13px; line-height: 18px; color: {{t.muted}};">{{e.time}}</span>
              </div>
            </div>
            <sc-if value="{{e.hasText}}" hint-placeholder-val="{{true}}">
              <p style="margin: 0; font-size: 16px; line-height: 24px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{e.text}}</p>
            </sc-if>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </div>

  <a href="#" style="height: 52px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; background: {{t.tide}}; color: {{t.onTide}}; font: 600 16px/20px Figtree, system-ui, sans-serif; text-decoration: none;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Nouvelle entrée
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const LIGHT = { surface: '#f3f6f5', raised: '#ffffff', ink: '#13272c', muted: '#4b5e64', tide: '#1d5f6b', onTide: '#ffffff', tideSoft: '#dbeae9', moods: ['#3c4f7c', '#6684b0', '#86b2ab', '#e2b55a', '#ef8c59'], onMood1: '#ffffff', onMood: '#13272c' };
    const DARK = { surface: '#0e191c', raised: '#172529', ink: '#e4eeec', muted: '#9db0b1', tide: '#7cc5c9', onTide: '#0a2226', tideSoft: '#1e383c', moods: ['#8fa3d6', '#7f9cc8', '#86b9b1', '#e6be6a', '#f29a6a'], onMood1: '#0e191c', onMood: '#0e191c' };
    const t = this.props.dark ? DARK : LIGHT;
    const labels = ['Très bas', 'Bas', 'Neutre', 'Bien', 'Très bien'];
    const entry = (mood, time, text) => ({
      mood, time, text, hasText: !!text, label: labels[mood - 1],
      dot: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; display: grid; place-items: center; background: ' + t.moods[mood - 1] + '; color: ' + (mood === 1 ? t.onMood1 : t.onMood) + "; font: 700 19px/1 'Bricolage Grotesque', system-ui, sans-serif;"
    });
    const days = [
      { label: "Aujourd'hui", entries: [entry(4, '20:10', "Marche au bord du lac avec ma sœur, puis une soirée calme à lire.")] },
      { label: 'Hier', entries: [entry(5, '18:30', 'Marché le matin, repas avec des amis, rien de prévu ensuite.'), entry(3, '09:05', '')] }
    ];
    return { t, days };
  }
}
</script>
</body>
</html>
