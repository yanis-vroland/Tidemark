<div class="wrap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:"Figtree",system-ui,sans-serif}.wrap{padding:16px;display:flex;flex-direction:column;gap:16px}:focus-visible{outline:3px solid var(--tide);outline-offset:2px}
.b{height:52px;max-width:361px;width:100%;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px/20px "Figtree",system-ui,sans-serif;cursor:pointer}
.p{border:0;background:var(--tide);color:var(--on-tide)}
.s{border:1px solid var(--line);background:var(--surface-raised);color:var(--tide)}
.x{border:1px solid var(--danger);background:var(--surface-raised);color:var(--danger)}
.d,.l{border:1px solid var(--line);background:var(--surface-raised);color:var(--ink-muted);cursor:default}
</style>
<button class="b p">Enregistrer</button>
<button class="b s">Exporter mes données</button>
<button class="b x">Tout supprimer</button>
<button class="b d" disabled>Enregistrer</button>
<button class="b l" aria-busy="true" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9"/></svg>Enregistrement…</button>
</div>
