<div class="wrap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:"Figtree",system-ui,sans-serif}.wrap{padding:16px;display:flex;flex-direction:column;gap:16px}:focus-visible{outline:3px solid var(--tide);outline-offset:2px}
.card{max-width:361px;box-sizing:border-box;padding:16px;border-radius:var(--radius-md);background:var(--surface-raised);display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:12px}
.dot{width:40px;height:40px;border-radius:var(--radius-pill);display:grid;place-items:center;background:var(--mood-4);color:var(--on-mood);font:700 19px/1 "Bricolage Grotesque",system-ui,sans-serif;flex:none}
.meta{display:flex;flex-direction:column}.h{font-size:17px;line-height:24px;font-weight:600}.c{font-size:13px;line-height:18px;color:var(--ink-muted)}
.t{margin:0;font-size:16px;line-height:24px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:4px 12px;border-radius:var(--radius-pill);background:var(--tide-soft);color:var(--ink);font-size:14px;line-height:20px;font-weight:500}
</style>
<article class="card" aria-label="Mardi 14 octobre, humeur 4 sur 5 : Bien">
<div class="top"><span class="dot" aria-hidden="true">4</span><div class="meta"><span class="h">Mardi 14 octobre</span><span class="c">21:40 · Bien</span></div></div>
<p class="t">Longue journée au travail, mais la balade du soir au bord de l'eau m'a fait du bien.</p>
<div class="tags"><span class="tag">fatigue</span><span class="tag">calme</span><span class="tag">travail</span><span class="tag">nature</span></div>
</article>
</div>
