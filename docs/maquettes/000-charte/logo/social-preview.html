<!doctype html>
<!--
  Source du visuel de partage GitHub (spec 007, CA9) : 1280 × 640, rendu en PNG
  par Chrome headless avec les polices de assets/fonts/ (voir le README de la
  charte, « Limites »). Couleurs : jetons clairs de tokens.json ; logo : géométrie
  de tool/generate_brand.py ; bandes : couverture de la charte.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tidemark, visuel de partage</title>
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("../../../../assets/fonts/BricolageGrotesque-Variable.ttf"); }
@font-face { font-family: "Figtree"; src: url("../../../../assets/fonts/Figtree-Variable.ttf"); }
html, body { margin: 0; }
.card { position: relative; width: 1280px; height: 640px; overflow: hidden; background: #f3f6f5; color: #13272c; font-family: "Figtree", system-ui, sans-serif; }
.bands { position: absolute; right: 0; top: 0; }
.text { position: absolute; left: 80px; top: 96px; width: 600px; display: flex; flex-direction: column; gap: 24px; }
.name { margin: 0; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 600; font-size: 112px; line-height: 1; letter-spacing: -2px; }
.tag { margin: 0; font-size: 34px; line-height: 44px; font-weight: 500; }
.facts { margin: 0; font-size: 22px; line-height: 32px; color: #4b5e64; }
</style>
</head>
<body>
<div class="card">
  <svg class="bands" width="560" height="640" viewBox="0 0 560 640" aria-hidden="true">
    <rect x="0" y="0" width="560" height="224" fill="#1d5f6b"></rect>
    <rect x="0" y="224" width="560" height="64" fill="#dbeae9"></rect>
    <rect x="48" y="288" width="512" height="56" fill="#ef8c59"></rect>
    <rect x="112" y="344" width="448" height="72" fill="#e2b55a"></rect>
    <rect x="192" y="416" width="368" height="80" fill="#86b2ab"></rect>
    <rect x="288" y="496" width="272" height="72" fill="#6684b0"></rect>
    <rect x="384" y="568" width="176" height="72" fill="#3c4f7c"></rect>
    <g fill="#f3f6f5">
      <circle cx="40" cy="224" r="24"></circle><circle cx="136" cy="224" r="24"></circle>
      <circle cx="232" cy="224" r="24"></circle><circle cx="328" cy="224" r="24"></circle>
      <circle cx="424" cy="224" r="24"></circle><circle cx="520" cy="224" r="24"></circle>
    </g>
  </svg>
  <div class="text">
    <svg width="120" height="120" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#1d5f6b"></rect><g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16 Q13.5 12.8 17 16 Q20.5 19.2 24 16 Q27.5 12.8 31 16 Q34.5 19.2 38 16"></path><path d="M24 22 L24 37"></path></g><circle cx="31.5" cy="37" r="2.6" fill="#e2b55a"></circle></svg>
    <p class="name">Tidemark</p>
    <p class="tag">Journal d'humeur.<br>L'IA reste sur ton téléphone.</p>
    <p class="facts">Flutter · iOS et Android · LLM local Qwen2.5-1.5B<br>Aucune donnée ne quitte l'appareil.</p>
  </div>
</div>
</body>
</html>
