<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Entrée enregistrée</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1d5f6b}a:hover{color:#0f3f48}
@keyframes tm-rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-640px);opacity:0}}
@keyframes tm-drift{to{transform:translateX(-131px)}}
@keyframes tm-pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}60%{transform:scale(1.08) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.tm-rise{animation:tm-rise 8s ease-in infinite}
.tm-drift{animation:tm-drift 9s linear infinite}
.tm-pop{animation:tm-pop .7s cubic-bezier(.2,.9,.3,1.3) both}
@media (prefers-reduced-motion:reduce){.tm-rise,.tm-drift,.tm-pop{animation:none}}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; box-sizing: border-box; padding: 120px 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 20px; background: {{t.hero}}; color: #ffffff; font-family: Figtree, system-ui, sans-serif; text-align: center;">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none;">
    <sc-for list="{{shownBubbles}}" as="b" hint-placeholder-count="8">
      <div class="tm-rise" style="{{b.style}}"></div>
    </sc-for>
    <svg width="393" height="300" viewBox="0 0 393 300" style="position: absolute; left: 0; bottom: 0; display: block;">
      <g class="tm-drift"><path d="M-131 40 Q-98 28 -65.5 40 T0 40 T65.5 40 T131 40 T196.5 40 T262 40 T327.5 40 T393 40 T458.5 40 T524 40 V300 H-131 Z" fill="{{t.wave}}"></path></g>
      <path d="M0 150 C80 130 160 168 240 148 S350 136 393 146 V300 H0 Z" fill="{{t.sand}}"></path>
    </svg>
  </div>

  <sc-if value="{{festive}}" hint-placeholder-val="{{true}}">
  <div class="tm-pop" aria-hidden="true" style="position: relative; width: 170px; height: 154px;">
    <svg width="170" height="154" viewBox="0 0 100 90">
      <path d="M42 80 L58 80 L56 88 L44 88 Z" fill="{{t.shellDark}}"></path>
      <path d="M14 30 Q17 14 28 12 Q34 6 42 9 Q50 4 58 9 Q66 6 72 12 Q83 14 86 30 L50 84 Z" fill="{{t.shell}}"></path>
      <g fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round">
        <path d="M50 82 L24 20"></path><path d="M50 82 L36 12"></path><path d="M50 82 L50 9"></path><path d="M50 82 L64 12"></path><path d="M50 82 L76 20"></path>
      </g>
      <path d="M93 6 l1.4 3.4 3.4 1.4 -3.4 1.4 -1.4 3.4 -1.4 -3.4 -3.4 -1.4 3.4 -1.4 Z" fill="#fdf0cf"></path>
      <path d="M6 44 l1 2.4 2.4 1 -2.4 1 -1 2.4 -1 -2.4 -2.4 -1 2.4 -1 Z" fill="#fdf0cf"></path>
    </svg>
  </div>
  </sc-if>
  <sc-if value="{{soft}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="position: relative; width: 120px; height: 108px;">
      <svg width="120" height="108" viewBox="0 0 100 90"><path d="M14 30 Q17 14 28 12 Q34 6 42 9 Q50 4 58 9 Q66 6 72 12 Q83 14 86 30 L50 84 Z" fill="{{t.softShell}}"></path></svg>
    </div>
  </sc-if>

  <div style="position: relative; display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 38px; line-height: 42px; letter-spacing: -1px;">{{title}}</h1>
    <p style="margin: 0; font-size: 17px; line-height: 25px; color: {{t.heroMuted}};">{{line}}</p>
  </div>

  <sc-if value="{{row}}" hint-placeholder-val="{{true}}">
  <div aria-label="Tes coquillages de la semaine" style="position: relative; display: flex; gap: 10px; padding: 12px 16px; border-radius: 999px; background: #ffffff1f;">
    <sc-for list="{{shells}}" as="s" hint-placeholder-count="6">
      <svg width="30" height="27" viewBox="0 0 100 90" aria-hidden="true"><path d="M14 30 Q17 14 28 12 Q34 6 42 9 Q50 4 58 9 Q66 6 72 12 Q83 14 86 30 L50 84 Z" fill="{{s}}"></path></svg>
    </sc-for>
  </div>
  </sc-if>

  <div style="flex-grow: 1;"></div>
  <a href="Journal.dc.html" style="position: relative; width: 100%; height: 58px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{t.btn}}; color: {{t.btnInk}}; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12); font: 700 17px/20px Figtree, system-ui, sans-serif; text-decoration: none;">Continuer</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"soft":{"editor":"boolean","default":false},"norank":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const t = dark
      ? { hero: '#0f3a41', heroMuted: '#c9dfdf', wave: '#13454c', sand: '#3a3222', shell: '#f0b84a', shellDark: '#b7852a', softShell: '#6b93d3', btn: '#7cc5c9', btnInk: '#0a2226' }
      : { hero: '#1d5f6b', heroMuted: '#d5ebea', wave: '#2a7480', sand: '#f6e4bd', shell: '#f0b84a', shellDark: '#c48f2c', softShell: '#6b93d3', btn: '#ffffff', btnInk: '#14262b' };
    const COL = ['#5868ad', '#6b93d3', '#62b3a5', '#f0b84a', '#f78b52'];
    const shells = [4, 3, 2, 4, 5, 4].map((l) => COL[l - 1]);
    const bubbles = [[30, 12, 0], [80, 20, 1.6], [150, 9, 3.1], [220, 16, 0.8], [290, 11, 2.2], [340, 18, 4], [110, 14, 5.2], [260, 8, 6]].map(([x, s, d]) => ({
      style: 'position: absolute; left: ' + x + 'px; bottom: 120px; width: ' + s + 'px; height: ' + s + 'px; border-radius: 50%; border: 2px solid #ffffff66; animation-delay: ' + d + 's;'
    }));
    const soft = !!this.props.soft;
    const norank = !!this.props.norank;
    return {
      t, shells, soft, festive: !soft, row: !soft && !norank,
      shownBubbles: soft ? [] : bubbles,
      title: soft ? 'Entrée enregistrée' : 'Coquillage ramassé',
      line: soft ? 'Elle rejoint ta plage.' : norank ? 'Il rejoint ta plage.' : 'Ton 6e de la semaine. Il rejoint ta plage, à côté des autres.'
    };
  }
}
</script>
</body>
</html>
