<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bulle de marée</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes tm-swell{to{transform:translateX(-24px)}}
@keyframes tm-bob{50%{transform:translateY(-3px)}}
.tm-swell{animation:tm-swell 3.2s linear infinite}
.tm-bob{animation:tm-bob 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tm-swell,.tm-bob{animation:none}}
</style>
</helmet>
<div aria-hidden="true" class="{{cls}}" style="{{box}}">
  <svg width="100%" height="100%" viewBox="0 0 48 48" aria-hidden="true" style="display: block;">
    <g class="tm-swell">
      <path d="{{wave}}" fill="{{water}}"></path>
      <path d="{{crest}}" fill="none" stroke="#ffffffb3" stroke-width="1.6" stroke-linecap="round"></path>
    </g>
    <ellipse cx="14" cy="11" rx="5" ry="2.6" transform="rotate(-32 14 11)" fill="#ffffff" fill-opacity="0.55"></ellipse>
    <sc-if value="{{face}}" hint-placeholder-val="{{true}}">
      <g fill="none" stroke="#14262b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <sc-if value="{{dotEyes}}" hint-placeholder-val="{{true}}">
          <circle cx="18" cy="21" r="2.3" fill="#14262b" stroke="none"></circle>
          <circle cx="30" cy="21" r="2.3" fill="#14262b" stroke="none"></circle>
        </sc-if>
        <sc-if value="{{l1}}" hint-placeholder-val="{{false}}">
          <path d="M14.5 16.5 L20 18.2"></path>
          <path d="M33.5 16.5 L28 18.2"></path>
          <path d="M19 31.5 Q24 27 29 31.5"></path>
          <path d="M31.5 24.5 q1.8 2.6 0 3.6 q-1.8 -1 0 -3.6 Z" fill="#8fc1ef" stroke="none"></path>
        </sc-if>
        <sc-if value="{{l2}}" hint-placeholder-val="{{false}}">
          <path d="M19.5 30.5 Q24 28.3 28.5 30.5"></path>
        </sc-if>
        <sc-if value="{{l3}}" hint-placeholder-val="{{false}}">
          <path d="M19.5 29.5 H28.5"></path>
        </sc-if>
        <sc-if value="{{l4}}" hint-placeholder-val="{{true}}">
          <path d="M18.5 27.5 Q24 33 29.5 27.5"></path>
          <circle cx="13.5" cy="26" r="2.6" fill="#ff8f7d" fill-opacity="0.55" stroke="none"></circle>
          <circle cx="34.5" cy="26" r="2.6" fill="#ff8f7d" fill-opacity="0.55" stroke="none"></circle>
        </sc-if>
        <sc-if value="{{l5}}" hint-placeholder-val="{{false}}">
          <path d="M15.5 21.5 Q18 18.2 20.5 21.5"></path>
          <path d="M27.5 21.5 Q30 18.2 32.5 21.5"></path>
          <path d="M17.5 26.5 Q24 36 30.5 26.5 Z" fill="#14262b"></path>
          <circle cx="13" cy="26.5" r="2.6" fill="#ff8f7d" fill-opacity="0.6" stroke="none"></circle>
          <circle cx="35" cy="26.5" r="2.6" fill="#ff8f7d" fill-opacity="0.6" stroke="none"></circle>
          <path d="M38 5 l1 2.4 2.4 1 -2.4 1 -1 2.4 -1 -2.4 -2.4 -1 2.4 -1 Z" fill="#ffffff" stroke="none"></path>
        </sc-if>
      </g>
    </sc-if>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"level":{"editor":"int","min":1,"max":5,"default":4},"size":{"editor":"int","default":96},"face":{"editor":"boolean","default":true},"bob":{"editor":"boolean","default":true},"ring":{"editor":"boolean","default":false},"dark":{"editor":"boolean","default":false},"delay":{"editor":"float","default":0},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const l = Math.min(5, Math.max(1, Number(this.props.level ?? 4)));
    const s = Number(this.props.size ?? 96);
    const dark = !!this.props.dark;
    const WATER = ['#5868ad', '#6b93d3', '#62b3a5', '#f0b84a', '#f78b52'];
    const TINT = ['#dfe3f6', '#dde9f9', '#d9f1eb', '#fdf0cf', '#ffe2d1'];
    const y = 40 - (l - 1) * 7.5;
    const a = [1, 1.6, 2.2, 2.8, 3.4][l - 1];
    let crest = 'M-26 ' + y + ' Q-20 ' + (y - a) + ' -14 ' + y;
    for (let x = -2; x <= 82; x += 12) crest += ' T' + x + ' ' + y;
    const ring = this.props.ring ? ' box-shadow: 0 0 0 3px ' + (dark ? '#0c1719' : '#ffffff') + ', 0 0 0 6px ' + (dark ? '#7cc5c9' : '#14262b') + ';' : '';
    const shadow = !ring && s >= 40 ? ' box-shadow: inset 0 -' + Math.round(s / 16) + 'px 0 rgba(20, 38, 43, 0.12);' : '';
    return {
      cls: this.props.bob === false ? '' : 'tm-bob',
      box: 'width: ' + s + 'px; height: ' + s + 'px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: ' + TINT[l - 1] + '; transition: background .3s, transform .2s; animation-delay: ' + Number(this.props.delay ?? 0) + 's;' + ring + shadow,
      wave: crest + ' V48 H-26 Z',
      crest,
      water: WATER[l - 1],
      face: this.props.face !== false,
      dotEyes: l !== 5,
      l1: l === 1, l2: l === 2, l3: l === 3, l4: l === 4, l5: l === 5
    };
  }
}
</script>
</body>
</html>
