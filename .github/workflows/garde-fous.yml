name: Garde-fous

# Workflow générique, copié dans les projets par scripts/init.sh du template agentic-dev-workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Version de gitleaks, fixée. Renovate propose sa mise à jour (renovate.json) ;
# l'archive est vérifiée avec le fichier d'empreintes publié avec la release.
env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: 8.30.1

jobs:
  garde-fous:
    name: Tests des garde-fous
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe des hooks, des scripts et de leurs tests (shellcheck)
        run: >-
          shellcheck .claude/hooks/*.sh .githooks/pre-commit .github/scripts/*.sh
          tests/hooks.sh tests/pre-commit.sh tests/verifier-revue-ia.sh
          tests/session-start.sh tests/verifier-journal.sh tests/quality-hooks.sh
          tests/verifier-modeles.sh tests/restrict-learnings.sh
          scripts/verifier-noms-exclus.sh tests/verifier-noms-exclus.sh

      - name: Tests des hooks de Claude Code
        run: bash tests/hooks.sh

      - name: Test du hook restrict-learnings de learning-curator
        run: bash tests/restrict-learnings.sh

      - name: Test des hooks de lint et de tests
        run: bash tests/quality-hooks.sh

      - name: Test du hook de début de session
        run: bash tests/session-start.sh

      - name: Test du contrôle du journal
        run: bash tests/verifier-journal.sh

      - name: Test de la vérification de la revue IA
        run: bash tests/verifier-revue-ia.sh

      - name: Test de la vérification du modèle des subagents
        run: bash tests/verifier-modeles.sh

      - name: Test du garde-fou des noms exclus
        run: bash tests/verifier-noms-exclus.sh

      - name: Modèle déclaré par chaque subagent (spec 007)
        run: .github/scripts/verifier-modeles.sh

      - name: Installation de gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # Exactement une ligne pour l'archive, sinon échec
          [ "$(grep -c "  ${archive}$" checksums.txt)" -eq 1 ]
          grep "  ${archive}$" checksums.txt | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Test du hook pre-commit
        run: bash tests/pre-commit.sh

  journal:
    name: Journal
    # Un fichier de journal par branche, jamais modifié après son merge (spec 004)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Contrôle du journal de la PR
        run: >-
          .github/scripts/verifier-journal.sh
          "origin/${{ github.base_ref }}" HEAD

  noms-exclus:
    name: Noms exclus
    # Aucun nom de client ni d'employeur réel dans les fichiers suivis, les commits
    # ni le titre, la description et la branche de la PR (CLAUDE.md de l'espace de
    # travail). La liste vient du secret EXCLUDED_NAMES et n'est jamais affichée ;
    # sans lui, le job échoue. Déclencheur pull_request (jamais pull_request_target) :
    # un secret n'est pas transmis à une PR ouverte depuis un fork, et le dépôt n'en
    # reçoit pas.
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # GitHub masque la valeur entière du secret, pas chaque nom : chacun est
      # masqué à part, au cas où une sortie future en citerait un.
      - name: Masquage de chaque nom dans les journaux
        env:
          EXCLUDED_NAMES: ${{ secrets.EXCLUDED_NAMES }}
        run: |
          printf '%s' "$EXCLUDED_NAMES" | tr ',' '\n' | while IFS= read -r name; do
            name=$(printf '%s' "$name" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$name" ]; then echo "::add-mask::$name"; fi
          done

      # Sur une PR, la version du script de la branche de base est lancée : une PR
      # ne peut pas affaiblir le contrôle qui la vérifie (sauf la toute première,
      # qui l'introduit). La plage contient le commit de merge de GitHub, et
      # git grep porte sur l'arbre fusionné.
      # Sur un push sur main, la plage est celle du push : elle contient le commit de
      # merge, dont le message reprend le titre et la branche de la PR.
      - name: Fichiers suivis, commits, titre et branche
        env:
          EXCLUDED_NAMES: ${{ secrets.EXCLUDED_NAMES }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          script=scripts/verifier-noms-exclus.sh
          if [ "$EVENT" = pull_request ]; then
            range="origin/${BASE_REF}..HEAD"
            if git cat-file -e "origin/${BASE_REF}:$script" 2>/dev/null; then
              git show "origin/${BASE_REF}:$script" >"$RUNNER_TEMP/verifier-noms-exclus.sh"
              script="$RUNNER_TEMP/verifier-noms-exclus.sh"
            fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="HEAD..HEAD"
          else
            range="${BEFORE}..HEAD"
          fi
          bash "$script" "$range"

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # Exactement une ligne pour l'archive, sinon échec
          [ "$(grep -c "  ${archive}$" checksums.txt)" -eq 1 ]
          grep "  ${archive}$" checksums.txt | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Analyse de tout l'historique
        run: gitleaks git --redact --verbose --no-banner .
