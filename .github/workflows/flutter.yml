name: Flutter

# Format, analyse statique et tests de l'app. Les tests n'exécutent jamais de vrai
# modèle d'IA : seule l'implémentation factice de MoodAnalyzer est utilisée (CLAUDE.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    name: Format, analyse et tests Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Actions épinglées par SHA, comme claude-code-action dans ai-review.yml : une
      # étiquette peut être déplacée par son auteur. Version de Flutter identique au poste.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Moteur natif llama.cpp (ADR-004, option A) : archives épinglées par SHA-256
      # dans scripts/llama-native.sha256, revérifiées à chaque exécution même quand
      # elles viennent du cache ; flutter test en a besoin pour l'hôte (linux-x64).
      - name: Tests du script du moteur natif et du contrôle du cache
        run: |
          bash tests/fetch-llama-native.sh
          bash tests/check-llama-hook-cache.sh

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .llamadart-native
          key: llamadart-native-${{ hashFiles('scripts/llama-native.sha256') }}

      - name: Moteur natif vérifié
        run: scripts/fetch-llama-native.sh

      # Contrôle B de l'ADR-004 : un moteur téléchargé sans contrôle par le hook, et
      # restauré par le cache de subosito/flutter-action, est effacé avant la
      # construction.
      - name: Cache de pub sans moteur non vérifié
        run: scripts/check-llama-hook-cache.sh --purge

      - name: Dépendances
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: dart analyze --fatal-infos

      - name: Tests
        run: flutter test

      # Contrôle B de l'ADR-004 : le hook n'a rien téléchargé lui-même pendant la
      # construction des tests.
      - name: Aucun moteur téléchargé par le hook
        run: scripts/check-llama-hook-cache.sh
