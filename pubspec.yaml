name: tidemark
description: "Journal d'humeur dont l'IA tourne entièrement sur le téléphone."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  characters: ^1.4.1
  crypto: 3.0.7
  drift: 2.35.2
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  llamadart: 0.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: 13.3.1
  sqlite3: 3.7.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  # Polices embarquées (licence OFL, assets/fonts) : aucune police chargée depuis le
  # réseau (RM1). Polices variables : la graisse passe par FontVariation.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf

# Base chiffrée par SQLite3MultipleCiphers (ADR-002) : le hook de sqlite3 télécharge
# ce binaire au build, vérifié par empreinte. Aucun accès réseau de l'app (RM1).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
